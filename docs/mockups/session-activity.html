<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session activity time — design preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: var(--foreground, #252525); background: var(--background, #fff); font: 13px/1.5 var(--font-sans, system-ui, sans-serif); }
.sa { width: 100%; max-width: 340px; }
.sa h2 { margin: 0; font-size: 14px; font-weight: 650; }
.sa-description { margin: 3px 0 12px; font-size: 12px; color: var(--muted-foreground, #666); }
.sa-shell { --sa-bg: #dcdcdc; --sa-text: #202020; --sa-subtle: #626262; --sa-line: #bdbdbd; --sa-input: #fff; --sa-selected: #0067c0; --sa-selected-text: #fff; height: 556px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--sa-line); color: var(--sa-text); background: var(--sa-bg); font: 13px/1.45 system-ui, sans-serif; }
body[data-demo-theme="dark"] .sa-shell { --sa-bg: #252526; --sa-text: #ddd; --sa-subtle: #aaa; --sa-line: #454545; --sa-input: #3c3c3c; --sa-selected: #094771; --sa-selected-text: #fff; }
.sa button, .sa input { font: inherit; color: inherit; }
.sa button { cursor: pointer; }
.sa button:focus-visible, .sa input:focus-visible, .sa summary:focus-visible { outline: 2px solid #1685dc; outline-offset: -2px; }
.sa-icon { width: 13px; height: 13px; flex: 0 0 13px; }
.sa-heading { display: flex; align-items: center; justify-content: space-between; padding: 12px 13px 10px; }
.sa-heading strong { font-size: 11px; }
.sa-icon-button { display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; padding: 3px; color: var(--sa-subtle) !important; }
.sa-search { display: flex; align-items: center; gap: 6px; margin: 0 9px 9px; padding: 6px 8px; background: var(--sa-input); border: 1px solid var(--sa-line); border-radius: 2px; color: var(--sa-subtle); }
.sa-search input { width: 100%; min-width: 0; font-size: 12px; border: 0; outline: 0; background: none; color: var(--sa-text); }
.sa-search input::placeholder { color: var(--sa-subtle); }
.sa-sections { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 0 9px; }
.sa-list { flex: 1; }
.sa-tree-row { display: flex; align-items: center; }
.sa-tree-marker { width: 16px; flex: 0 0 16px; color: var(--sa-subtle); display: flex; justify-content: center; }
.sa-thread { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; width: 100%; min-height: 49px; padding: 7px 8px; border: 0; border-radius: 3px; text-align: left; background: none; }
.sa-thread:hover { background: #00000009; }
.sa-thread[aria-current="page"] { background: var(--sa-selected); color: var(--sa-selected-text); }
.sa-thread > .sa-icon { opacity: .75; }
.sa-thread-text { flex: 1; min-width: 0; }
.sa-title-line { display: flex; align-items: center; gap: 5px; line-height: 18px; }
.sa-title { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 600; }
.sa-meta { display: flex; align-items: center; gap: 7px; min-width: 0; margin-top: 3px; font-size: 10px; line-height: 14px; color: var(--sa-subtle); }
.sa-thread[aria-current="page"] .sa-meta { color: inherit; opacity: .9; }
.sa-branch { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sa-age { flex: 0 0 auto; white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; }
.sa-provider { width: 12px; height: 12px; flex: 0 0 12px; color: var(--sa-text); }
.sa-thread[aria-current="page"] .sa-provider { color: inherit; }
.sa-empty { color: var(--sa-subtle); font-size: 12px; margin: 12px 8px; }
.sa-shelf { border-top: 1px solid var(--sa-line); }
.sa-shelf summary { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 8px 7px; font-size: 12px; list-style: none; }
.sa-shelf summary::-webkit-details-marker { display: none; }
.sa-shelf summary > span:first-of-type { flex: 1; }
.sa-count { color: var(--sa-subtle); font-size: 10px; }
.sa-shelf[open] summary > .sa-chevron { transform: rotate(90deg); }
.sa-footer { display: flex; align-items: center; justify-content: space-between; margin: 0 9px; border-top: 1px solid var(--sa-line); padding: 6px 5px; font-size: 10px; color: var(--sa-subtle); }
.sa-demo-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 9px 0 0; font-size: 11px; color: var(--muted-foreground, #666); }
.sa-theme { padding: 3px 7px; border: 1px solid var(--border, #ccc); border-radius: 4px; background: var(--secondary, #f5f5f5); }
.sa-note { margin: 8px 0 0; font-size: 12px; color: var(--muted-foreground, #666); }
</style>
</head>
<body>
<section class="sa" aria-label="Session activity mockup">
  <h2>Session activity</h2>
  <p class="sa-description">Time beside the provider. No extra row.</p>
  <aside class="sa-shell" aria-label="Sessions design preview">
    <header class="sa-heading"><strong>SESSIONS</strong><span class="sa-icon-button" aria-hidden="true"><svg class="sa-icon" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></header>
    <label class="sa-search"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.5"/></svg><input id="sa-search" type="search" placeholder="Search conversations…" aria-label="Search demo sessions"></label>
    <div class="sa-sections">
      <nav class="sa-list" id="sa-list" aria-label="Active conversations"></nav>
      <details class="sa-shelf"><summary><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Settled</span><span class="sa-count">1</span><svg class="sa-icon sa-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary><div id="sa-settled"></div></details>
      <details class="sa-shelf"><summary><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4zM6 8v12h12V8m-9 5h6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Archive</span><span class="sa-count">1</span><svg class="sa-icon sa-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary><div id="sa-archived"></div></details>
    </div>
    <footer class="sa-footer"><span aria-hidden="true">⚙</span><span>Current workspace only</span><span aria-hidden="true">⟳</span></footer>
  </aside>
  <div class="sa-demo-tools"><span>Click a session · hover its time</span><button class="sa-theme" id="sa-theme" type="button">Dark theme</button></div>
  <p class="sa-note">Older than 7 days: date. Hover: exact local time.</p>
</section>
<script>
(() => {
  const demoNow = new Date('2026-10-08T16:00:00').getTime();
  const minute = 60_000, hour = 60 * minute, day = 24 * hour;
  const compactAge = timestamp => {
    const elapsed = Math.max(0, demoNow - new Date(timestamp).getTime());
    if (elapsed < minute) return '<1 min';
    if (elapsed < hour) return `${Math.floor(elapsed / minute)} min`;
    if (elapsed < day) return `${Math.floor(elapsed / hour)} hr`;
    if (elapsed <= 7 * day) { const days = Math.floor(elapsed / day); return `${days} ${days === 1 ? 'day' : 'days'}`; }
    return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', ...(new Date(timestamp).getFullYear() !== new Date(demoNow).getFullYear() ? { year: 'numeric' } : {}) }).format(new Date(timestamp));
  };
  const sessions = [
    { id: 'finalize', title: 'finalize v0.1', branch: 'impl-worktree', age: .5 * minute },
    { id: 'scratch', title: 'from scratch', branch: 'main', age: 15 * minute },
    { id: 'connection', title: 'troubleshoot-connection', branch: '', age: 30 * minute },
    { id: 'picker', title: 'Sync Model Picker and Image Paste', branch: '', age: 8 * hour },
    { id: 'worktree', title: 'make-worktree', branch: 'main', age: 3 * day },
    { id: 'installer', title: 'check installer', branch: 'release/0.1.15', age: 7 * day },
    { id: 'shortcuts', title: 'editor shortcuts', branch: 'feature/a-very-long-branch-name', age: 9 * day }
  ].map(session => ({ ...session, timestamp: new Date(demoNow - session.age).toISOString() }));
  const messageIcon = '<svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H9l-5 4V4Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const providerIcon = '<svg class="sa-provider" viewBox="100 100 411 411" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M252.794 108.802C289.191 99.0484 326.265 110.305 351.148 135.135C385.113 126.072 422.85 134.862 449.492 161.505C476.136 188.149 484.925 225.888 475.862 259.85V259.854C500.696 284.735 511.95 321.81 502.198 358.207C492.447 394.602 464.161 421.084 430.215 430.217C421.083 464.162 394.603 492.448 358.206 502.199C321.812 511.951 284.734 500.693 259.852 475.864C225.887 484.927 188.15 476.137 161.507 449.495C134.864 422.851 126.073 385.111 135.136 351.149C110.304 326.266 99.0496 289.192 108.801 252.795C118.552 216.4 146.84 189.918 180.784 180.785C189.917 146.841 216.396 118.553 252.794 108.802ZM374.292 407.145C374.292 411.271 372.092 415.086 368.517 417.148L283.723 466.102C302.487 480.585 327.555 486.459 352.217 479.852C386.997 470.532 410.068 439.312 410.555 405.006V317.717C410.555 315.08 409.125 312.621 406.843 311.303L374.292 292.509V407.145ZM251.868 415.897C248.296 417.959 243.893 417.959 240.317 415.897L155.526 366.942C152.366 390.436 159.811 415.08 177.866 433.136H177.863C203.325 458.594 241.896 462.962 271.85 446.232L347.449 402.586C349.735 401.268 351.148 398.8 351.148 396.163V358.579L251.868 415.897ZM368.602 220.628C366.319 219.309 363.474 219.318 361.191 220.637L328.641 239.431L427.921 296.749C431.496 298.811 433.697 302.627 433.697 306.752V404.661C455.622 395.654 473.244 376.881 479.851 352.218C489.169 317.442 473.668 281.85 444.201 264.274L368.602 220.628ZM177.303 206.34C155.377 215.348 137.756 234.122 131.148 258.783C121.832 293.561 137.331 329.153 166.799 346.727L242.398 390.373C244.68 391.692 247.525 391.684 249.807 390.366L282.357 371.572L183.078 314.253C179.504 312.189 177.303 308.375 177.303 304.251V206.34ZM259.849 279.145V331.858L305.5 358.213L351.15 331.858V279.145L305.5 252.789L259.849 279.145ZM327.276 144.9C308.512 130.418 283.445 124.543 258.782 131.15C224.002 140.471 200.931 171.691 200.445 205.995V293.286C200.445 295.923 201.875 298.381 204.158 299.7L236.707 318.493V203.856C236.707 199.731 238.909 195.916 242.483 193.853L327.276 144.9ZM433.137 177.867C407.675 152.407 369.103 148.038 339.149 164.769L263.55 208.415C261.265 209.734 259.852 212.202 259.852 214.838V252.423L359.132 195.105C362.703 193.041 367.108 193.041 370.682 195.105L455.473 244.06C458.635 220.567 451.189 195.922 433.135 177.867H433.137Z"/></svg>';
  const fullTime = timestamp => new Intl.DateTimeFormat('en-US', { dateStyle: 'full', timeStyle: 'long' }).format(new Date(timestamp));
  let active = 'picker';
  const row = session => {
    const container = document.createElement('div'); container.className = 'sa-tree-row';
    container.innerHTML = `<span class="sa-tree-marker" aria-hidden="true">›</span><button class="sa-thread" type="button" data-session="${session.id}">${messageIcon}<span class="sa-thread-text"><span class="sa-title-line"><span class="sa-title"></span></span><span class="sa-meta"><span class="sa-branch"></span><time class="sa-age"></time>${providerIcon}</span></span></button>`;
    const button = container.querySelector('button');
    const age = container.querySelector('time');
    container.querySelector('.sa-title').textContent = session.title;
    container.querySelector('.sa-branch').textContent = session.branch;
    container.querySelector('.sa-branch').title = session.branch;
    age.textContent = compactAge(session.timestamp); age.dateTime = session.timestamp;
    age.title = `Last active: ${fullTime(session.timestamp)}`;
    age.setAttribute('aria-label', age.title);
    button.setAttribute('aria-label', `${session.title}, last active ${age.textContent}`);
    if (session.id === active) button.setAttribute('aria-current', 'page');
    button.addEventListener('click', () => {
      active = session.id;
      document.querySelectorAll('.sa-thread').forEach(item => item.removeAttribute('aria-current'));
      button.setAttribute('aria-current', 'page');
    });
    return container;
  };
  const list = document.querySelector('#sa-list');
  const render = () => {
    const query = document.querySelector('#sa-search').value.trim().toLowerCase();
    list.replaceChildren(...sessions.filter(session => `${session.title} ${session.branch}`.toLowerCase().includes(query)).map(row));
    if (!list.children.length) { const empty = document.createElement('p'); empty.className = 'sa-empty'; empty.textContent = 'No matching sessions.'; list.append(empty); }
  };
  document.querySelector('#sa-search').addEventListener('input', render);
  document.querySelector('#sa-settled').append(row({ id: 'docs', title: 'documentation', branch: 'main', timestamp: new Date(demoNow - 2 * day).toISOString() }));
  document.querySelector('#sa-archived').append(row({ id: 'old', title: 'early prototype', branch: 'main', timestamp: new Date('2025-12-18T09:30:00').toISOString() }));
  document.querySelector('#sa-theme').addEventListener('click', event => {
    const dark = document.body.dataset.demoTheme !== 'dark'; document.body.dataset.demoTheme = dark ? 'dark' : 'light';
    document.querySelectorAll('.sa-theme, .mr-theme').forEach(button => { button.textContent = dark ? 'Light theme' : 'Dark theme'; });
  });
  render();
  console.log('Session mockup ready: 49px rows; compact activity times, exact time tooltips, search and shelves. Demo timestamps are fixed; selection does not update activity.');
})();
</script>
</body>
</html>
